name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "student-checkin/supabase/**"
      - ".github/workflows/deploy-supabase.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-checkin
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Push config
        run: supabase config push --project-ref "$PROJECT_REF"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: |
          supabase functions deploy daily-rollover --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy send-notifications --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy recalculate-reports --project-ref "$PROJECT_REF" --use-api
